<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sherif Ashraf | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-black: #060709;
        --card-bg: rgba(14, 17, 24, 0.85);
        --text-white: #ffffff;
        --text-dim: #949db0;
        --gold-glow: #d4af37;
        --gold-light: #f3e5ab;
        --accent-green: #25d366;
        --accent-pink: #fc6c85;
        --cyber-cyan: #00f0ff;
        --border-glass: rgba(255, 255, 255, 0.12);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-black);
        color: var(--text-white);
        overflow-x: hidden;
        line-height: 1.6;
      }

      /* Cursor الدائرة المضيئة المتبع للماوس */
      .custom-cursor-glow {
        position: fixed;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        z-index: 999;
        transition: transform 0.06s ease-out;
      }

      /* 1. HERO SECTION (نفس إنترو الفيديو: لوجو ذهبي مشع) */
      .hero-section {
        min-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding: 40px 20px;
      }

      .glowing-brand-title {
        font-family: 'Cinzel', serif;
        font-size: clamp(3.2rem, 8vw, 6rem);
        font-weight: 900;
        letter-spacing: 4px;
        color: var(--gold-light);
        text-shadow: 0 0 25px rgba(212, 175, 55, 0.8), 0 0 60px rgba(212, 175, 55, 0.3);
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .hero-sub {
        font-size: 1.2rem;
        color: var(--text-dim);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 24px;
      }

      .hero-buttons {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 28px;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-gold {
        background: linear-gradient(135deg, #d4af37, #aa8010);
        color: #000;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      }

      .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
      }

      .btn-glass {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border: 1px solid var(--border-glass);
      }

      .btn-glass:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-2px);
      }

      /* 2. SERVICES SECTION (01, 02, 03, 04 زي الفيديو) */
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .section-headline {
        text-align: center;
        margin: 80px 0 40px;
      }

      .section-headline h2 {
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .services-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }

      .service-card {
        background: var(--card-bg);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        padding: 24px;
        position: relative;
        transition: transform 0.3s ease, border-color 0.3s ease;
      }

      .service-card:hover {
        transform: translateY(-6px);
        border-color: var(--gold-glow);
      }

      .service-num {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        font-weight: 900;
        color: var(--gold-glow);
        margin-bottom: 12px;
      }

      .service-card h3 {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }

      .service-card p {
        font-size: 0.88rem;
        color: var(--text-dim);
      }

      /* 3. MAJOR CASE STUDIES (جنب بعض) */
      .case-studies-duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      .duo-card {
        background: var(--card-bg);
        border-radius: 20px;
        border: 1px solid var(--border-glass);
        overflow: hidden;
        transition: transform 0.35s ease;
      }

      .duo-card:hover {
        transform: translateY(-6px);
      }

      .duo-visual {
        width: 100%;
        height: 320px;
        background: #000;
      }

      .duo-visual img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .duo-body {
        padding: 24px;
      }

      .duo-body h3 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      .duo-body p {
        font-size: 0.92rem;
        color: var(--text-dim);
        margin-bottom: 20px;
      }

      /* 4. SHORT-FORM EDITS (سكرول ناعم 9:16 زي الفيديو) */
      .shorts-viewport {
        overflow-x: auto;
        padding: 20px 0;
        display: flex;
        gap: 20px;
        scrollbar-width: thin;
        scrollbar-color: var(--gold-glow) transparent;
      }

      .shorts-viewport::-webkit-scrollbar {
        height: 6px;
      }

      .shorts-viewport::-webkit-scrollbar-thumb {
        background: var(--gold-glow);
        border-radius: 6px;
      }

      .short-card {
        flex: 0 0 240px;
        height: 420px;
        border-radius: 16px;
        background: var(--card-bg);
        border: 1px solid var(--border-glass);
        overflow: hidden;
        position: relative;
        cursor: pointer;
        transition: transform 0.3s ease, border-color 0.3s ease;
      }

      .short-card:hover {
        transform: scale(1.04);
        border-color: var(--gold-glow);
      }

      .short-card img,
      .short-card video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

        position: absolute;
        bottom: 14px;
        left: 14px;
        background: rgba(0, 0,
